name: Image

# The image is only rebuilt when something upstream actually moved:
#
#   * the llama-swap base image digest (`ghcr.io/mostlygeek/llama-swap:cuda`)
#   * a new stable release of weicj/vLLM-2080Ti-Definitive
#   * a change to the build recipe in this repository
#
# There is deliberately no "rebuild on every push / every week" behaviour: a
# full build compiles vLLM from source and takes hours, so the weekly job is a
# *check* that only escalates to a build when the base digest changed.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'serve-foreground.sh'
      - '.github/llama-swap-base'
      - '.github/vllm-ref'
      - '.github/workflows/image.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: 'Override the pinned upstream release tag (empty = keep .github/vllm-ref)'
        required: false
        default: ''
      max_jobs:
        description: 'Compiler parallelism; lower it if the runner runs out of memory'
        required: false
        default: '4'
  schedule:
    # Check for a new llama-swap base image. A new upstream vLLM release opens a
    # pull request instead of building straight away.
    - cron: '23 3 * * 1'

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LLAMA_SWAP_IMAGE: ghcr.io/mostlygeek/llama-swap
  LLAMA_SWAP_TAG: cuda
  UPSTREAM_REPO: weicj/vLLM-2080Ti-Definitive
  BOT_BRANCH: automation/upstream-sync

jobs:
  # Cheap pull-request gate: builds only the toolchain stage (minutes) instead
  # of the hours-long runtime build.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell script and Dockerfile toolchain
        run: |
          shellcheck serve-foreground.sh
          docker build --target toolchain -f Dockerfile .

      - name: Check for committed secrets or real infrastructure data
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(\.env|.*\.secret|.*\.pem|.*\.key)$' || true)"
          if git grep -nIE '192\.168\.|BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo 'Found host addresses or private keys in tracked files.' >&2
            exit 1
          fi

  detect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      base: ${{ steps.decide.outputs.base }}
      base_changed: ${{ steps.decide.outputs.base_changed }}
      vllm_ref: ${{ steps.decide.outputs.vllm_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream state
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_digest=$(docker buildx imagetools inspect "${LLAMA_SWAP_IMAGE}:${LLAMA_SWAP_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "pinned_base=$(tr -d '[:space:]' < .github/llama-swap-base)" >> "$GITHUB_OUTPUT"
          echo "pinned_ref=$(tr -d '[:space:]' < .github/vllm-ref)" >> "$GITHUB_OUTPUT"
          latest_ref=$(gh api "repos/${UPSTREAM_REPO}/releases" --paginate \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')
          case "$latest_ref" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid upstream release tag: $latest_ref" >&2; exit 1 ;;
          esac
          echo "latest_ref=${latest_ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved llama-swap base digest: ${base_digest}"
          echo "Pinned upstream release: $(tr -d '[:space:]' < .github/vllm-ref), latest: ${latest_ref}"

      - name: Propose upstream release bump
        if: github.event_name == 'schedule' && steps.upstream.outputs.latest_ref != steps.upstream.outputs.pinned_ref
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.upstream.outputs.latest_ref }}
          PREVIOUS_REF: ${{ steps.upstream.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BOT_BRANCH"
          printf '%s\n' "$TARGET_REF" > .github/vllm-ref
          git add .github/vllm-ref
          git commit -m "Pin vLLM 2080 Ti Definitive to ${TARGET_REF}"
          git push --force origin "$BOT_BRANCH"
          body=$(printf '%s\n' \
            "Upstream released \`${TARGET_REF}\` (currently pinned: \`${PREVIOUS_REF}\`)." \
            "" \
            "Merging this bumps \`.github/vllm-ref\` and triggers the image build," \
            "which recompiles vLLM from that tag. Review the upstream release notes" \
            "for SM75 route changes before merging." )
          gh pr create --base main --head "$BOT_BRANCH" \
            --title "Pin vLLM 2080 Ti Definitive to ${TARGET_REF}" \
            --body "$body" \
            || gh pr comment "$BOT_BRANCH" --body "$body"

      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE_REF: ${{ inputs.vllm_ref }}
          BASE_DIGEST: ${{ steps.upstream.outputs.base_digest }}
          PINNED_BASE: ${{ steps.upstream.outputs.pinned_base }}
          PINNED_REF: ${{ steps.upstream.outputs.pinned_ref }}
          LATEST_REF: ${{ steps.upstream.outputs.latest_ref }}
        run: |
          set -euo pipefail
          resolved_base="${LLAMA_SWAP_IMAGE}:${LLAMA_SWAP_TAG}@${BASE_DIGEST}"
          build=false
          base_changed=false
          vllm_ref="$PINNED_REF"

          [ "$resolved_base" = "$PINNED_BASE" ] || base_changed=true

          case "$EVENT" in
            push)
              # The build recipe (or a merged upstream bump) changed.
              build=true
              ;;
            workflow_dispatch)
              build=true
              [ -n "$OVERRIDE_REF" ] && vllm_ref="$OVERRIDE_REF"
              ;;
            schedule)
              if [ "$base_changed" = true ]; then
                echo "llama-swap base moved, will rebuild with ${resolved_base}"
                build=true
              else
                echo "llama-swap base unchanged (${PINNED_BASE})"
              fi
              if [ "$LATEST_REF" != "$PINNED_REF" ]; then
                echo "upstream ${LATEST_REF} is not pinned yet; pull request opened, not building"
              fi
              ;;
          esac

          {
            echo "build=${build}"
            echo "base=${resolved_base}"
            echo "base_changed=${base_changed}"
            echo "vllm_ref=${vllm_ref}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    # GitHub kills a job at 360 minutes; keep headroom so a slow first build
    # fails cleanly instead of being cancelled mid-export.
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=llama-swap image bundling the vLLM 2080 Ti Definitive Edition (SM75) runtime
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.digest=${{ needs.detect.outputs.base }}

      # Registry cache, not actions/cache: the builder stage is tens of
      # gigabytes and would blow the 10 GB GitHub Actions cache budget.
      # `mode=max` is required so the expensive runtime-builder stage is cached,
      # not just the final image layers.
      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VLLM_REF=${{ needs.detect.outputs.vllm_ref }}
            LLAMA_SWAP_BASE=${{ needs.detect.outputs.base }}
            MAX_JOBS=${{ inputs.max_jobs || '4' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true

      # Record the base digest only after the image published, so a failed build
      # leaves the pin untouched and the next check retries it.
      - name: Record the new base digest
        if: needs.detect.outputs.base_changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ needs.detect.outputs.base }}' > .github/llama-swap-base
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/llama-swap-base
          git commit -m "Track llama-swap base ${{ needs.detect.outputs.base }}"
          git push origin HEAD:main || echo 'push failed; the digest will be re-detected next run'

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| upstream ref | \`${{ needs.detect.outputs.vllm_ref }}\` |"
            echo "| llama-swap base | \`${{ needs.detect.outputs.base }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
